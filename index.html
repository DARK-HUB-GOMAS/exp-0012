<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="version" content="5">
<meta name="theme-color" content="#0B0C14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M16 3L27 11L25 25L16 30L7 25L5 11Z%22 fill=%22%235969C9%22/%3E%3C/svg%3E">
<title>Expediente N.° 001-2026 · Bruno S. c. Carla M.</title>
<style>
/* =====================================================================
   EL EXPEDIENTE — página previa a PROJECT ARCHIVE (un solo archivo).
   Tres diligencias cortas → sello → se entrega la contraseña del archivo.
   Ajustes en el bloque CONFIG del script (al final).
   ===================================================================== */
:root{
  --bg:#0B0C14;--bg2:#111426;--s1:#191D35;--s2:#222944;--bd:#343B58;--bd2:#454E73;
  --ind:#5969C9;--blu:#7297F5;--vio:#9277D8;--warm:#D59A72;--gold:#F2C66D;
  --tx:#F5F3F8;--tx2:#B5B8CA;--tx3:#8B8FA8;--ok:#86C9AE;--err:#E58F8F;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.1,1);--r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);-webkit-text-size-adjust:100%}
body{font-family:var(--sans);line-height:1.55;min-height:100dvh;overflow-x:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blu);outline-offset:3px;border-radius:8px}

/* ---------- fondo: retícula en perspectiva y estructuras lejanas ---------- */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(120% 70% at 50% 0%,#171B38 0%,var(--bg) 62%)}
.bg svg{position:absolute;inset:0;width:100%;height:100%}
.bg .grid{animation:gridMove 9s linear infinite}
@keyframes gridMove{to{transform:translateY(40px)}}
.bg .float{animation:floaty 9s ease-in-out infinite alternate}
@keyframes floaty{to{transform:translateY(-10px)}}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,12,20,.15),rgba(11,12,20,.75) 55%,rgba(11,12,20,.95))}

/* ---------- estructura ---------- */
.app{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(1rem + env(safe-area-inset-top)) clamp(1.1rem,5vw,2rem) calc(1rem + env(safe-area-inset-bottom));max-width:40rem;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;font:600 .68rem/1.4 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--tx3)}
.top b{color:var(--tx2);font-weight:600}
.steps{display:flex;gap:.4rem}
.steps i{width:1.6rem;height:4px;border-radius:4px;background:var(--bd);transition:background .5s var(--ease),width .5s var(--ease)}
.steps i.on{background:var(--blu);width:2.2rem}
.steps i.done{background:var(--ok)}
.screen{flex:1;display:flex;flex-direction:column;justify-content:center;padding:1.6rem 0 1rem;animation:scrIn .6s var(--ease) both}
.screen.out{animation:scrOut .28s ease forwards}
@keyframes scrIn{from{opacity:0;transform:translateY(16px);filter:blur(4px)}}
@keyframes scrOut{to{opacity:0;transform:translateY(-12px);filter:blur(4px)}}
.eyebrow{font:600 .7rem/1.4 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--blu);margin:0 0 .8rem}
h1,h2{font-family:var(--serif);font-weight:400;letter-spacing:-.01em;margin:0 0 .9rem}
h1{font-size:clamp(2rem,1.4rem + 3.2vw,2.9rem);line-height:1.1}
h2{font-size:clamp(1.5rem,1.2rem + 1.8vw,2rem);line-height:1.18}
p{margin:0 0 1rem;color:var(--tx2)}
.lead{font-size:1.06rem}
.small{font-size:.85rem;color:var(--tx3)}
.reveal>*{opacity:0;animation:rise .7s var(--ease) forwards}
.reveal>*:nth-child(1){animation-delay:.05s}.reveal>*:nth-child(2){animation-delay:.15s}.reveal>*:nth-child(3){animation-delay:.25s}
.reveal>*:nth-child(4){animation-delay:.35s}.reveal>*:nth-child(5){animation-delay:.45s}.reveal>*:nth-child(6){animation-delay:.55s}.reveal>*:nth-child(7){animation-delay:.65s}
h1:focus,h2:focus{outline:none}
.reveal>.stk{opacity:1}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- botones (pulgar derecho: principal ancho a la derecha) ---------- */
.acts{display:flex;gap:.6rem;margin-top:1.4rem;flex-direction:row-reverse}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3.25rem;padding:0 1.4rem;border-radius:999px;border:1px solid var(--bd);
  background:rgba(25,29,53,.85);color:var(--tx);font-size:1rem;cursor:pointer;text-decoration:none;transition:transform .15s,background .2s,border-color .2s,opacity .2s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.btn.primary{flex:1;background:var(--ind);border-color:var(--ind);box-shadow:0 10px 26px -10px rgba(89,105,201,.8)}
.btn.primary:hover{background:#6576D6}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:none;border-color:transparent;color:var(--tx3);min-height:2.75rem;padding:0 .4rem;font-size:.9rem;text-decoration:underline;text-underline-offset:3px}
.btn svg{width:18px;height:18px}

/* ---------- carátula del expediente ---------- */
.folder{position:relative;border:1px solid var(--bd);border-radius:var(--r);background:linear-gradient(160deg,#1A1F3C,#12152B);padding:1.4rem 1.2rem 1.2rem;margin:0 0 1.2rem;overflow:hidden}
.folder::before{content:"";position:absolute;top:0;left:1.2rem;width:7rem;height:5px;border-radius:0 0 4px 4px;background:var(--warm)}
.folder dl{display:grid;grid-template-columns:auto 1fr;gap:.35rem .9rem;margin:0;font-size:.9rem}
.folder dt{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);padding-top:.15rem}
.folder dd{margin:0;color:var(--tx)}
.folder .stamp-mini{position:absolute;right:-.6rem;top:.8rem;transform:rotate(12deg);font:700 .62rem/1 var(--mono);letter-spacing:.2em;color:var(--warm);border:1.5px solid var(--warm);border-radius:6px;padding:.35rem .5rem;opacity:.8}

/* ---------- diligencia 1: el caso ---------- */
.case{border-left:3px solid var(--warm);padding:.2rem 0 .2rem 1rem;margin:0 0 1.2rem}
.case p{color:var(--tx);margin-bottom:.6rem}
.case .note{font-size:.88rem;color:var(--tx3);font-style:italic}
.opts{display:grid;gap:.6rem}
.opt{display:flex;gap:.9rem;align-items:flex-start;width:100%;text-align:left;padding:1rem 1.05rem;border:1px solid var(--bd);border-radius:14px;background:rgba(17,20,38,.85);cursor:pointer;
  transition:border-color .2s,background .2s,transform .15s}
.opt:active{transform:scale(.985)}
.opt .k{flex:none;width:1.8rem;height:1.8rem;border-radius:50%;display:grid;place-items:center;border:1px solid var(--bd2);font:600 .8rem var(--mono);color:var(--tx2)}
.opt b{display:block;font-weight:600;color:var(--tx)}
.opt span.d{font-size:.88rem;color:var(--tx3)}
.opt.ok{border-color:var(--ok);background:rgba(134,201,174,.1)}.opt.ok .k{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.opt.no{border-color:var(--err);animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.hint{min-height:1.5rem;font-size:.92rem;color:var(--warm);margin:.9rem 0 0}
.hint.good{color:var(--ok)}

/* ---------- diligencia 2: ordenar la sentencia ---------- */
.slots{display:grid;gap:.5rem;margin:0 0 1rem}
.slot{display:flex;align-items:center;gap:.8rem;min-height:3.6rem;padding:.6rem .9rem;border:1.5px dashed var(--bd2);border-radius:14px;background:rgba(11,12,20,.5);transition:border-color .25s,background .25s}
.slot .n{flex:none;font:600 .8rem var(--mono);color:var(--tx3);width:1.4rem}
.slot.filled{border-style:solid;border-color:var(--ind);background:rgba(89,105,201,.12);cursor:pointer}
.slot.filled .pc{animation:pop .35s var(--ease)}
.slot.right{border-color:var(--ok);background:rgba(134,201,174,.1)}
.slot.wrong{border-color:var(--err);animation:shake .4s}
.slot .pc b{display:block;font-weight:600}.slot .pc span{font-size:.84rem;color:var(--tx3)}
.slot .empty{font-size:.88rem;color:var(--tx3)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.pieces{display:grid;gap:.5rem}
.piece{width:100%;text-align:left;padding:.85rem 1rem;border:1px solid var(--bd);border-radius:14px;background:var(--s1);cursor:pointer;transition:opacity .25s,transform .15s}
.piece:active{transform:scale(.98)}
.piece b{display:block;font-weight:600}.piece span{font-size:.84rem;color:var(--tx3)}
.piece.used{opacity:0;pointer-events:none;transform:scale(.96);height:0;padding:0;border:0;margin:-.25rem 0}
.tiny{font-size:.8rem;color:var(--tx3);margin:.4rem 0 0}

/* ---------- diligencia 3: contrato y firma ---------- */
.contract{border:1px solid var(--bd);border-radius:var(--r);background:#F3EFE6;color:#23263A;padding:1.2rem 1.1rem;margin:0 0 1rem;max-height:46dvh;overflow:auto;font-family:var(--serif);box-shadow:0 18px 40px -20px rgba(0,0,0,.7)}
.contract h3{font-family:var(--serif);font-weight:600;font-size:1.05rem;text-align:center;letter-spacing:.06em;text-transform:uppercase;margin:0 0 .2rem}
.contract .sub{text-align:center;font-size:.8rem;color:#6B6F85;margin:0 0 1rem;font-family:var(--sans)}
.contract ol{margin:0;padding:0;list-style:none;counter-reset:c}
.contract li{counter-increment:c;margin:0 0 .75rem;font-size:.97rem;line-height:1.5}
.contract li::before{content:counter(c,upper-roman) ". ";font-weight:700;color:#7A5A44}
.contract .sig-l{margin:1rem 0 0;font-size:.8rem;color:#6B6F85;font-family:var(--sans)}
.sigbox{position:relative;border-radius:14px;background:#FBF9F4;border:1px solid #D8D2C4;height:9.5rem;touch-action:none;overflow:hidden}
.sigbox canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.sigbox .line{position:absolute;left:1rem;right:1rem;bottom:2.1rem;height:1px;background:#C9C1B0}
.sigbox .ph{position:absolute;left:1rem;bottom:.6rem;font-size:.78rem;color:#9A927F;pointer-events:none;font-family:var(--sans)}
.sigrow{display:flex;justify-content:space-between;align-items:center;margin:.4rem 0 0}
.stamp{position:absolute;left:50%;top:50%;width:9rem;height:9rem;margin:-4.5rem 0 0 -4.5rem;border-radius:50%;border:3px double #B5452F;color:#B5452F;display:grid;place-items:center;text-align:center;
  font:700 .78rem/1.25 var(--mono);letter-spacing:.14em;opacity:0;transform:scale(2.4) rotate(-24deg);pointer-events:none;mix-blend-mode:multiply}
.stamp.on{animation:stamp .5s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes stamp{to{opacity:.9;transform:scale(1) rotate(-12deg)}}

/* ---------- compuerta y entrega ---------- */
.gate{position:fixed;inset:0;z-index:20;pointer-events:none}
.gate .door{position:absolute;top:0;bottom:0;width:50%;background:var(--bg)}
.gate .l{left:0;box-shadow:inset -1px 0 0 rgba(114,151,245,.5);transform:translateX(-101%)}
.gate .r{right:0;transform:translateX(101%)}
.gate.close .l,.gate.close .r{transform:none;transition:transform .55s cubic-bezier(.7,0,.2,1)}
.gate.open .l{transform:translateX(-101%);transition:transform .8s cubic-bezier(.7,0,.2,1) .15s}
.gate.open .r{transform:translateX(101%);transition:transform .8s cubic-bezier(.7,0,.2,1) .15s}
.gate .seam{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:linear-gradient(transparent,#9DB5FF 30%,#fff 50%,#9DB5FF 70%,transparent);opacity:0;box-shadow:0 0 18px 2px rgba(114,151,245,.6)}
.gate.open .seam{animation:seam .9s ease}
@keyframes seam{30%{opacity:1}100%{opacity:0}}
.mech{position:absolute;left:50%;top:50%;width:8rem;height:8rem;margin:-4rem 0 0 -4rem;opacity:0}
.gate.close .mech{opacity:1;transition:opacity .3s .35s}
.gate.close .mech .ra{animation:spin 1.4s cubic-bezier(.2,.7,.1,1) .35s both}
.gate.close .mech .rb{animation:spinB 1.3s cubic-bezier(.2,.7,.1,1) .4s both}
.gate.close .mech .core{animation:core .5s ease 1.3s both}
.mech *{transform-box:fill-box;transform-origin:center}
@keyframes spin{from{transform:rotate(30deg)}to{transform:rotate(360deg)}}
@keyframes spinB{from{transform:rotate(-40deg)}to{transform:rotate(-240deg)}}
@keyframes core{from{fill:#2B3260}to{fill:#F5F3F8}}

.prize{text-align:center}
.keycard{position:relative;margin:1.2rem auto 1rem;padding:1.3rem 1.2rem 1.1rem;max-width:24rem;border-radius:var(--r);border:1px solid var(--bd2);
  background:linear-gradient(160deg,#1C2246,#12152B);box-shadow:0 0 0 1px rgba(114,151,245,.12),0 24px 50px -20px rgba(89,105,201,.55);overflow:hidden}
.keycard::after{content:"";position:absolute;inset:-40% -60%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.09) 50%,transparent 60%);animation:shine 3.2s ease-in-out 1s infinite}
@keyframes shine{from{transform:translateX(-40%)}to{transform:translateX(40%)}}
.keycard .lbl{font:600 .66rem/1.4 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--tx3);margin-bottom:.5rem}
.keycard .pw{font:600 clamp(1.3rem,1rem + 2.4vw,1.75rem)/1.2 var(--mono);letter-spacing:.06em;color:var(--tx);word-break:break-all;user-select:all;-webkit-user-select:all}
.copy{margin-top:.9rem;min-height:2.75rem;font-size:.92rem}
.prize .acts{flex-direction:column}
.prize .acts .btn{width:100%}

/* ---------- sticker ---------- */
.stk{display:block;width:5.4rem;height:5.4rem;margin:0 0 .8rem;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));animation:stkIn .7s var(--ease) .2s both,stkFloat 6s ease-in-out 1.2s infinite}
.prize .stk{margin:0 auto .6rem}
@keyframes stkIn{from{opacity:0;transform:translateY(.6rem) rotate(-14deg) scale(.85)}}
@keyframes stkFloat{50%{transform:translateY(-5px) rotate(2deg)}}

.toast{position:fixed;left:50%;top:calc(1rem + env(safe-area-inset-top));transform:translate(-50%,-1rem);opacity:0;z-index:30;padding:.7rem 1.1rem;border-radius:999px;
  background:var(--s2);border:1px solid var(--bd2);font-size:.9rem;transition:opacity .3s,transform .3s;pointer-events:none;max-width:calc(100% - 2rem)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (min-width:700px){.app{padding-top:2rem}.screen{padding-top:2.5rem}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ===================== caso completo ===================== */
.steps i{width:1.1rem}.steps i.on{width:1.7rem}
.phase{font:600 .7rem/1.4 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--warm);margin:0 0 .5rem}
.story{border-left:3px solid var(--warm);padding:.1rem 0 .1rem 1rem;margin:0 0 1.2rem}
.story p{color:var(--tx);margin:0 0 .7rem}
.story p:last-child{margin:0}
.parties{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:0 0 1.2rem}
.party{border:1px solid var(--bd);border-radius:14px;padding:.8rem .9rem;background:rgba(17,20,38,.8)}
.party small{display:block;font:600 .62rem/1.4 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);margin-bottom:.25rem}
.party b{display:block;font-weight:600}.party span{font-size:.82rem;color:var(--tx3)}
/* pruebas */
.evs{display:grid;gap:.6rem;margin:0 0 1rem}
.ev{width:100%;text-align:left;display:flex;gap:.9rem;align-items:center;padding:.9rem 1rem;border:1px solid var(--bd);border-radius:14px;background:rgba(17,20,38,.85);cursor:pointer;transition:border-color .2s,background .2s}
.ev .tag{flex:none;width:2.2rem;height:2.2rem;border-radius:10px;display:grid;place-items:center;font:700 .85rem var(--mono);background:var(--s2);color:var(--tx2)}
.ev b{display:block;font-weight:600}.ev span.d{font-size:.84rem;color:var(--tx3)}
.ev.seen{border-color:rgba(134,201,174,.55)}.ev.seen .tag{background:var(--ok);color:var(--bg)}
.ev[aria-expanded="true"]{border-color:var(--blu)}
.evbody{overflow:hidden;max-height:0;transition:max-height .45s var(--ease)}
.evbody.open{max-height:40rem}
.evin{margin:.2rem 0 .4rem;padding:1rem;border-radius:14px;background:#F3EFE6;color:#23263A;font-size:.92rem}
.chat{display:grid;gap:.45rem;font-family:var(--sans)}
.bub{max-width:84%;padding:.55rem .8rem;border-radius:14px;line-height:1.4}
.bub.me{justify-self:end;background:#DCF2D3;border-bottom-right-radius:4px}
.bub.her{justify-self:start;background:#fff;border-bottom-left-radius:4px}
.bub small{display:block;font-size:.68rem;color:#7B7F90;margin-top:.15rem;text-align:right}
.chatday{justify-self:center;font-size:.7rem;color:#7B7F90;background:#E8E2D4;border-radius:8px;padding:.15rem .6rem}
.photo{position:relative;height:11rem;border-radius:10px;background:linear-gradient(160deg,#2A2F45,#14172A);overflow:hidden}
.photo .scr{position:absolute;inset:12% 14% 22%;border-radius:6px;background:linear-gradient(135deg,#2E3A6B,#1A1E36)}
.photo .scr::after{content:"";position:absolute;inset:0;background:
  linear-gradient(32deg,transparent 48%,rgba(255,255,255,.8) 49%,transparent 50%),
  linear-gradient(-58deg,transparent 47%,rgba(255,255,255,.7) 48%,transparent 49%),
  linear-gradient(80deg,transparent 60%,rgba(255,255,255,.6) 61%,transparent 62%)}
.photo .base{position:absolute;left:8%;right:8%;bottom:12%;height:8%;border-radius:0 0 8px 8px;background:#3A4060}
.cap{font-size:.82rem;color:#5A5E70;margin:.6rem 0 0}
.receipt{font-family:var(--mono);font-size:.82rem;line-height:1.6}
.receipt .row{display:flex;justify-content:space-between;border-bottom:1px dashed #C9C1B0;padding:.2rem 0}
.receipt .tot{font-weight:700;border-bottom:0}
/* pregunta */
.qcard{margin:1.2rem 0 0}
.qcard .qq{font-family:var(--serif);font-size:1.25rem;line-height:1.3;color:var(--tx);margin:0 0 .9rem}
.explain{display:none;margin:.9rem 0 0;padding:.9rem 1rem;border-radius:14px;border:1px solid rgba(134,201,174,.45);background:rgba(134,201,174,.08);color:var(--tx);font-size:.93rem}
.explain.on{display:block;animation:rise .45s var(--ease)}
.explain b{color:var(--ok)}
/* fallo */
.fallo{border:1px solid var(--bd);border-radius:var(--r);background:#F3EFE6;color:#23263A;padding:1.1rem 1rem;font-family:var(--serif);box-shadow:0 18px 40px -20px rgba(0,0,0,.7)}
.fallo h3{font-weight:600;text-align:center;letter-spacing:.08em;text-transform:uppercase;font-size:1rem;margin:0 0 .2rem}
.fallo .sub{text-align:center;font-size:.78rem;color:#6B6F85;margin:0 0 1rem;font-family:var(--sans)}
.fline{margin:0 0 1rem}
.fline>p{margin:0 0 .45rem;color:#23263A;font-size:.97rem}
.fline>p b{color:#7A5A44}
.seg{display:flex;flex-wrap:wrap;gap:.35rem}
.seg button{flex:1 1 auto;min-height:2.6rem;padding:.4rem .7rem;border-radius:10px;border:1px solid #CFC7B5;background:#FBF9F4;color:#2F3347;font:500 .86rem var(--sans);cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.seg button[aria-pressed="true"]{background:#2F3A7A;border-color:#2F3A7A;color:#fff}
.fline.bad .seg{animation:shake .4s}.fline.bad .why{display:block}
.fline.good .seg button[aria-pressed="true"]{background:#2E7D5B;border-color:#2E7D5B}
.why{display:none;font:400 .82rem/1.45 var(--sans);color:#9A3B2C;margin:.45rem 0 0}
.score{display:inline-flex;gap:.5rem;align-items:center;margin:.4rem 0 1rem;padding:.45rem .9rem;border-radius:999px;border:1px solid var(--bd2);font:600 .78rem var(--mono);letter-spacing:.08em;color:var(--tx2)}
.expn{white-space:nowrap}.steps{gap:.3rem}.steps i{width:.9rem}.steps i.on{width:1.4rem}
.receipt .row span:last-child{white-space:nowrap;padding-left:.6rem}
.fline.bad{border-left:3px solid #C0533F;padding-left:.6rem}
.fallo p{color:#23263A}.fallo .why{color:#B23A2A}
.keycard::after{pointer-events:none}.keycard .copy,.keycard .pw{position:relative;z-index:1}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">

      '<div class="fallo"><h3>Sentencia</h3><p class="sub">Exp. N.° 001-2026 · Bruno S. c. Carla M. · Restitución e indemnización</p>' +
      '<p style="margin:0 0 1rem;font-size:.95rem"><b style="letter-spacing:.08em">SE RESUELVE:</b></p>' +
      FALLO.map(function (f, i) { return '<div class="fline" id="' + f.id + '"><p><b>' + ['Primero', 'Segundo', 'Tercero', 'Cuarto', 'Quinto'][i] + '.</b> ' + f.p + '</p><div class="seg" role="group">' +
        f.o.map(function (o, k) { return '<button type="button" data-f="' + f.id + '" data-k="' + k + '" aria-pressed="false">' + o + '</button>'; }).join('') + '</div><p class="why">' + f.why + '</p></div>'; }).join('') + '</div>' +
      '<p class="hint" id="fhint" aria-live="polite"></p>' +
      '<div class="acts" id="checkWrap"><button class="btn primary" id="check" disabled>Comprobar el fallo ' + ARROW + '</button></div>' +
      '<div id="signWrap" hidden><p style="margin-top:1.2rem">El fallo es correcto. Ahora firma la sentencia:</p>' +
      '<div class="sigbox" id="sigbox"><span class="line"></span><span class="ph">Firma aquí</span><canvas id="sig" aria-label="Recuadro de firma"></canvas><div class="stamp" id="stamp">SENTENCIA<br>FIRMADA</div></div>' +
      '<div class="sigrow"><span class="small">La firma no se guarda en ningún lado.</span><button class="btn ghost" id="clear">Borrar</button></div>' +
      '<div class="acts"><button class="btn primary" id="sign" disabled>Firmar y notificar ' + ARROW + '</button></div></div>', function () {
        var check = document.getElementById('check'), hint = document.getElementById('fhint');
        main.querySelectorAll('.seg button').forEach(function (b) {
          b.onclick = function () {
            if (main.querySelector('#signWrap:not([hidden])')) return;
            var f = b.dataset.f; pick[f] = +b.dataset.k;
            b.parentNode.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
            document.getElementById(f).classList.remove('bad', 'good');
            check.disabled = Object.keys(pick).length < FALLO.length;
          };
        });
        check.onclick = function () {
          var wrong = 0;
          FALLO.forEach(function (f) {
            var el = document.getElementById(f.id), ok = pick[f.id] === f.ok;
            el.classList.remove('bad', 'good'); void el.offsetWidth; el.classList.add(ok ? 'good' : 'bad'); if (!ok) wrong++;
            if (firstCheck) { totalChecks++; if (ok) firstTry++; }
          });
          firstCheck = false;
          if (wrong) { hint.className = 'hint'; hint.textContent = wrong === 1 ? 'Hay un punto por corregir. Lee la observación en rojo.' : 'Hay ' + wrong + ' puntos por corregir. Lee las observaciones en rojo.'; return; }
          hint.className = 'hint good'; hint.textContent = '';
          document.getElementById('checkWrap').hidden = true;
          var sw = document.getElementById('signWrap'); sw.hidden = false;
          setTimeout(function () { sw.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' }); }, 100);
          initSig(f6);
        };
      });
  }
  function initSig(after) {
    var cv = document.getElementById('sig'), box = document.getElementById('sigbox'), btn = document.getElementById('sign'), ph = box.querySelector('.ph');
    var ctx = cv.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 2), drawing = false, last = null, ink = 0, done = false;
    function size() { var r = box.getBoundingClientRect(); cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1F2550'; ink = 0; btn.disabled = true; ph.style.opacity = 1; }
    size();
    function pt(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, t: performance.now() }; }
    cv.addEventListener('pointerdown', function (e) { if (done) return; drawing = true; last = pt(e); cv.setPointerCapture(e.pointerId); ph.style.opacity = 0; e.preventDefault(); });
    cv.addEventListener('pointermove', function (e) {
      if (!drawing || done) return; var p = pt(e), d = Math.hypot(p.x - last.x, p.y - last.y); if (d < 1) return;
      var v = d / Math.max(1, p.t - last.t); ctx.lineWidth = Math.max(1.4, 3.2 - v * 1.2);
      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); ink += d; last = p;
      if (ink > 120) btn.disabled = false;
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { cv.addEventListener(ev, function () { drawing = false; }); });
    document.getElementById('clear').onclick = function () { if (done) return; ctx.clearRect(0, 0, cv.width, cv.height); size(); };
    window.addEventListener('resize', function () { if (!done) size(); });
    btn.onclick = function () {
      if (btn.disabled || done) return; done = true; btn.disabled = true;
      document.getElementById('stamp').classList.add('on'); if (navigator.vibrate) navigator.vibrate(30);
      setTimeout(after, REDUCED ? 200 : 1400);
    };
  }

  /* ---------- 6 · Apelación ---------- */
  function f6() {
    phase(6, 'La apelación', 'Carla no se rinde',
      '<div class="story"><p>Notificada la sentencia, Carla dice que «esto no se queda así».</p></div>',
      ['q8'], function () {
        setStep(6);
        show('<div class="reveal"><p class="phase">Fase 6 de 6 · Segunda instancia</p><h2>La Sala Civil confirma la sentencia</h2>' +
          '<div class="story"><p>La Sala revisa el expediente y confirma la decisión en todos sus extremos.</p><p>Bruno recupera su cámara, reparada y sin arena. Carla promete que la próxima vez alquilará una.</p></div>' +
          '<div class="acts"><button class="btn primary" id="close">Archivar el expediente ' + ARROW + '</button></div></div>', function () {
            document.getElementById('close').onclick = finish;
          });
      }, 'Ver la resolución');
  }

  /* ---------- Final: compuerta y contraseña ---------- */
  // Copia con la API moderna y, si el navegador la bloquea, con el método clásico (funciona en Android, iPhone y PC).
  function legacyCopy(t) {
    var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px';
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);
    var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta); return ok;
  }
  function copyText(t) {
    var done = function () { var b = document.getElementById('copy'); toast('Contraseña copiada'); if (b) { b.textContent = 'Copiada'; setTimeout(function () { b.textContent = 'Copiar contraseña'; }, 2000); } };
    var fallback = function () {
      if (legacyCopy(t)) return done();
      var r = document.createRange(), el = document.getElementById('pw'); r.selectNodeContents(el); var s = getSelection(); s.removeAllRanges(); s.addRange(r);
      toast('Mantén presionada la contraseña para copiarla', 3500);
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, fallback); else fallback();
  }
  function verdict() {
    var r = firstTry / Math.max(1, totalChecks);
    return r === 1 ? 'Con honores' : r >= .75 ? 'Sobresaliente' : r >= .5 ? 'Aprobada con buen criterio' : 'Aprobada: el juzgado valora la perseverancia';
  }
  function finish() {
    steps.forEach(function (s) { s.className = 'done'; });
    var g = document.getElementById('gate');
    var reveal = function () {
      show('<div class="prize reveal">' + JUEZ +
        '<p class="eyebrow">Expediente archivado</p>' +
        '<h1>Caso cerrado.</h1>' +
        '<span class="score">Aciertos al primer intento: ' + firstTry + ' de ' + totalChecks + ' · ' + verdict() + '</span>' +
        '<p class="lead">El juzgado resuelve entregarte la contraseña del archivo.</p>' +
        '<div class="keycard"><div class="lbl">Contraseña del archivo</div><div class="pw" id="pw">' + esc(CONFIG.password) + '</div>' +
        '<button class="btn copy" id="copy">Copiar contraseña</button></div>' +
        '<div class="acts"><a class="btn primary" href="' + esc(CONFIG.formUrl) + '" id="goForm">Ir al archivo ' + ARROW + '</a></div>' +
        '<p class="small" style="margin-top:1rem">Guárdala por si sales y vuelves más tarde.</p></div>', function () {
          document.getElementById('copy').onclick = function () { copyText(CONFIG.password); };
        });
    };
    if (REDUCED) { reveal(); return; }
    g.className = 'gate close';
    setTimeout(function () { reveal(); g.className = 'gate open'; }, 1900);
    setTimeout(function () { g.className = 'gate'; }, 3000);
  }

  intro();
})();
</script>
</body>
